
services:
  database:
    image: postgres:17
    container_name: postgres_db
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: backend_app
    env_file: .env
    depends_on:
      database:
        condition: service_healthy
    ports: 
      - "${API_PORT}:3000"
    restart: unless-stopped

  frontend: 
    build:
      context: ./frontend
      args: 
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: frontend_app
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes: 
  pg_data:
  

